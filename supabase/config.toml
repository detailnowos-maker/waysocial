# Configuração do Supabase CLI para desenvolvimento local (`supabase start`).
# Docs: https://supabase.com/docs/guides/local-development
project_id = "waysocial"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "waysocial://"
additional_redirect_urls = ["waysocial://"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Em desenvolvimento local o cadastro entra direto; em produção, ligue a confirmação por e-mail.
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true
